name: Diagnostico Gus OS
on:
  push:
    branches: [claude/chatgpt-agent-panel-integration-wf0vq9]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Testa endpoints de producao (sem token, espera 401)
        run: |
          BASE=https://painel-controle-pearl.vercel.app
          echo "== Home"; curl -sS -o /dev/null -w "HTTP %{http_code}\n" $BASE/ || true
          for e in ler-tarefas ler-ideias ler-diario ler-agenda criar-tarefa criar-ideia anotar-diario criar-evento; do
            echo "== POST /api/chatgpt/$e"
            curl -sS -m 20 -X POST $BASE/api/chatgpt/$e -H "Content-Type: application/json" -d '{}' -w "\nHTTP %{http_code} (%{time_total}s)\n" || true
          done
          echo "== Token invalido em ler-agenda"
          curl -sS -m 20 -X POST $BASE/api/chatgpt/ler-agenda -H "Authorization: Bearer invalido" -H "Content-Type: application/json" -d '{}' -w "\nHTTP %{http_code}\n" || true
