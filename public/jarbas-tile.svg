<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Jarbas">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0a2a4a"/>
      <stop offset="0.55" stop-color="#05121f"/>
      <stop offset="1" stop-color="#030a14"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2f6ff"/>
      <stop offset="0.45" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="holeL"><rect width="400" height="300" fill="#fff"/><rect x="83" y="108" width="56" height="56" rx="17" fill="#000"/></mask>
    <mask id="holeR"><rect width="400" height="300" fill="#fff"/><rect x="261" y="108" width="56" height="56" rx="17" fill="#000"/></mask>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <g filter="url(#glow)" opacity="0.92">
    <g mask="url(#holeL)"><rect x="46" y="70" width="130" height="130" rx="42" fill="url(#eye)"/></g>
    <g mask="url(#holeR)"><rect x="224" y="70" width="130" height="130" rx="42" fill="url(#eye)"/></g>
  </g>
  <g fill="#00e5ff" filter="url(#glow)">
    <rect x="131" y="236" width="22" height="9" rx="4.5"/>
    <rect x="160" y="236" width="22" height="9" rx="4.5"/>
    <rect x="189" y="236" width="22" height="9" rx="4.5"/>
    <rect x="218" y="236" width="22" height="9" rx="4.5"/>
    <rect x="247" y="236" width="22" height="9" rx="4.5"/>
  </g>
</svg>
